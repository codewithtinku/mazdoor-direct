<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Mazdoor Direct</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Login Overlay Modal */
    #loginModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .login-box input {
      width: 100%;
      padding: 10px 14px;
      margin: 16px 0;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .login-box button {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .admin-table th, .admin-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }
    .admin-table th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
    }
    .btn-del {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-toggle {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .status-verified { background: #dcfce7; color: #15803d; }
    .status-unverified { background: #fef3c7; color: #b45309; }
  </style>
</head>
<body>

  <!-- Lock Modal -->
  <div id="loginModal">
    <div class="login-box">
      <i class="fa-solid fa-shield-halved" style="font-size: 2.5rem; color: var(--primary);"></i>
      <h3 style="margin-top: 12px; color: #1e293b;">Admin Access</h3>
      <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Dashboard open karne ke liye secret PIN dalein.</p>
      
      <input type="password" id="adminPassword" placeholder="Admin PIN/Password">
      <button id="btnLogin"><i class="fa-solid fa-lock-open"></i> Unlock Dashboard</button>
      <div id="loginErr" style="color: #dc2626; font-size: 0.85rem; margin-top: 10px; display: none;"></div>
    </div>
  </div>

  <!-- Main Admin Dashboard Content -->
  <header class="navbar">
    <div class="brand">
      <i class="fa-solid fa-person-digging logo-icon"></i>
      <span class="brand-name">Mazdoor<span>Direct</span> [Admin]</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <a href="index.html" class="btn-register-link"><i class="fa-solid fa-arrow-left"></i> Directory</a>
      <button onclick="logoutAdmin()" style="background:#ef4444; color:white; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:600;">Logout</button>
    </div>
  </header>

  <main class="container" style="margin-top: 24px;">
    <h2>Workers Management</h2>
    <p style="color: #64748b; font-size: 0.9rem;">Yahan se aap kisi bhi karigar ko Verify ya Delete kar sakte hain.</p>

    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Photo</th>
            <th>Naam</th>
            <th>Phone</th>
            <th>Category</th>
            <th>Area</th>
            <th>Verification</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminWorkersTable">
          <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const loginModal = document.getElementById('loginModal');
    const adminPassword = document.getElementById('adminPassword');
    const btnLogin = document.getElementById('btnLogin');
    const loginErr = document.getElementById('loginErr');
    const tableBody = document.getElementById('adminWorkersTable');

    // Check if already logged in (sessionStorage)
    if (sessionStorage.getItem('mazdoor_admin_auth') === 'true') {
      loginModal.style.display = 'none';
      loadAdminWorkers();
    }

    btnLogin.addEventListener('click', async () => {
      const pass = adminPassword.value.trim();
      if (!pass) return;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json();

        if (data.success) {
          sessionStorage.setItem('mazdoor_admin_auth', 'true');
          loginModal.style.display = 'none';
          loadAdminWorkers();
        } else {
          loginErr.textContent = data.message;
          loginErr.style.display = 'block';
        }
      } catch (err) {
        loginErr.textContent = 'Server se connect nahi ho saka.';
        loginErr.style.display = 'block';
      }
    });

    async function loadAdminWorkers() {
      try {
        const res = await fetch('/api/workers');
        const result = await res.json();

        if (!result.success || result.data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Koi worker nahi hai.</td></tr>';
          return;
        }

        tableBody.innerHTML = result.data.map(w => {
          const photo = w.profile_photo 
            ? `<img src="${w.profile_photo}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">`
            : `<div style="width:36px; height:36px; border-radius:50%; background:#ecfdf5; color:#047857; display:flex; align-items:center; justify-content:center; font-weight:700;">${w.full_name.charAt(0)}</div>`;

          const verifyBtn = w.is_verified 
            ? `<button onclick="toggleVerify(${w.id})" class="btn-toggle status-verified"><i class="fa-solid fa-check"></i> Verified</button>`
            : `<button onclick="toggleVerify(${w.id})" class="btn-toggle status-unverified"><i class="fa-regular fa-clock"></i> Unverified</button>`;

          return `
            <tr>
              <td>${photo}</td>
              <td><b>${w.full_name}</b></td>
              <td>${w.phone_number}</td>
              <td>${w.category_name}</td>
              <td>${w.locality_name}</td>
              <td>${verifyBtn}</td>
              <td>
                <button onclick="deleteWorker(${w.id})" class="btn-del" title="Delete Worker"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Workers load nahi ho sake.</td></tr>';
      }
    }

    window.toggleVerify = async (id) => {
      try {
        await fetch(`/api/workers/${id}/verify`, { method: 'PATCH' });
        loadAdminWorkers();
      } catch (err) {
        alert('Status update nahi ho saka.');
      }
    };

    window.deleteWorker = async (id) => {
      if (!confirm('Kya aap sach me is worker ko delete karna chahte hain?')) return;
      try {
        await fetch(`/api/workers/${id}`, { method: 'DELETE' });
        loadAdminWorkers();
      } catch (err) {
        alert('Delete nahi ho saka.');
      }
    };

    window.logoutAdmin = () => {
      sessionStorage.removeItem('mazdoor_admin_auth');
      window.location.reload();
    };
  </script>
</body>
</html>
