<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Registration | MazdoorDirect</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .geo-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .geo-btn:hover {
      background-color: #1d4ed8;
    }
    .geo-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="logo">👷 MazdoorDirect</div>
    <a href="index.html" class="nav-btn">← Directory me Wapas Jayein</a>
  </header>

  <main class="form-container">
    <h2>Naye Karigar / Helper Ka Registration</h2>
    <p class="subtitle">Apni details bharein taaki direct phone calls aur WhatsApp par kaam mil sake</p>

    <form id="registerForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>📷 Apni Photo Upload Karein (Optional)</label>
        <input type="file" name="photo" accept="image/*">
      </div>

      <div class="form-group">
        <label for="name">Pura Naam (Full Name) *</label>
        <input type="text" id="name" name="name" placeholder="e.g. Ramesh Kumar" required>
      </div>

      <div class="form-group">
        <label for="phone">Mobile / WhatsApp Number *</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
      </div>

      <div class="form-group">
        <label for="categorySelect">Kaam Ka Prakar (Skill / Trade) *</label>
        <select id="categorySelect" name="category_id" required>
          <option value="">Category Chunein</option>
        </select>
      </div>

      <div class="form-group">
        <label for="localitySelect">Mohalla / Local Area *</label>
        <select id="localitySelect" name="locality_id" required>
          <option value="">Area Chunein</option>
        </select>
      </div>

      <!-- Current Location Button -->
      <div class="form-group" style="margin: 15px 0;">
        <label style="display:block; font-weight:600; margin-bottom:6px;">Current Location</label>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <button type="button" id="geoBtn" class="geo-btn" onclick="getLocation()">
            📍 Use My Current Location
          </button>
          <span id="geoStatus" style="font-size: 13px; font-weight: 500;"></span>
        </div>
        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">
      </div>

      <div class="form-group">
        <label for="daily_rate">Daily Rate (₹)</label>
        <input type="number" id="daily_rate" name="daily_rate" placeholder="e.g. 600">
      </div>

      <div class="form-group">
        <label for="visiting_charge">Visiting Charge (₹)</label>
        <input type="number" id="visiting_charge" name="visiting_charge" placeholder="e.g. 150">
      </div>

      <div class="form-group">
        <label for="experience_years">Experience (Saal)</label>
        <input type="number" id="experience_years" name="experience_years" placeholder="e.g. 5">
      </div>

      <button type="submit" class="submit-btn" style="background:#059669; color:white; padding:12px; border:none; border-radius:6px; font-size:16px; cursor:pointer; width:100%; font-weight:600;">
        ✅ Profile Banayein & Register Karein
      </button>
    </form>
  </main>

  <script>
    // 1. Fetch Categories & Localities on Page Load
    async function loadDropdowns() {
      try {
        const catRes = await fetch('/api/categories');
        const categories = await catRes.json();
        const catSelect = document.getElementById('categorySelect');
        categories.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          catSelect.appendChild(opt);
        });

        const locRes = await fetch('/api/localities');
        const localities = await locRes.json();
        const locSelect = document.getElementById('localitySelect');
        localities.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id;
          opt.textContent = l.name;
          locSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('Dropdown load error:', err);
      }
    }

    loadDropdowns();

    // 2. Geolocation Function
    function getLocation() {
      const status = document.getElementById('geoStatus');
      const btn = document.getElementById('geoBtn');

      if (!navigator.geolocation) {
        status.innerText = 'Geolocation browser me supported nahi hai.';
        status.style.color = '#dc2626';
        return;
      }

      status.innerText = 'Locating... Kripya wait karein';
      status.style.color = '#2563eb';
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          document.getElementById('latitude').value = position.coords.latitude;
          document.getElementById('longitude').value = position.coords.longitude;
          status.innerText = `✅ Location captured! (${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)})`;
          status.style.color = '#16a34a';
          btn.disabled = false;
        },
        (error) => {
          btn.disabled = false;
          if (error.code === error.PERMISSION_DENIED) {
            status.innerText = '❌ Permission denied. Browser me location allow karein.';
          } else {
            status.innerText = '❌ Location fetch nahi ho saki.';
          }
          status.style.color = '#dc2626';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 3. Form Submit Handler
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/workers', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          alert('Worker successfully register ho gaya!');
          window.location.href = 'index.html';
        } else {
          alert('Registration failed: ' + (data.message || 'Error occurred'));
        }
      } catch (err) {
        alert('Server se connect nahi ho saka.');
      }
    });
  </script>
</body>
</html>
